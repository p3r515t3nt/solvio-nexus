name: SolvioApprovals
options:
  bundleIdPrefix: de.solvio
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.0.0
  SolvioApprovalsKit:
    path: .
targets:
  SolvioApprovals:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SolvioApprovalsKit
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.solvio.approvals
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "36"
        INFOPLIST_FILE: App/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/SolvioApprovals.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SOLVIO Nexus
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan the SOLVIO pairing QR code to pair this device."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Damit du mit SOLVIO sprechen kannst. Das Mikrofon läuft nur während eines Gesprächs, das du selbst startest."
        INFOPLIST_KEY_NSContactsUsageDescription: "SOLVIO gleicht Namen und Mailadressen mit deinen Kontakten ab, damit Nachrichten an die richtige Person gehen."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Approve SOLVIO actions with Face ID."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Reach the SOLVIO approval gateway on your local network."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
  SolvioApprovalsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SolvioApprovalsAppTests
    dependencies:
      - target: SolvioApprovals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.solvio.approvals.apptests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SolvioApprovals.app/SolvioApprovals"
        BUNDLE_LOADER: "$(TEST_HOST)"
  SolvioApprovalsNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SolvioApprovalsNavigationUITests
    dependencies:
      - target: SolvioApprovals
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.solvio.approvals.navigationtests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: SolvioApprovals

schemes:
  # Explicit build and application-test schemes.
  SolvioApprovals:
    build:
      targets:
        SolvioApprovals: all
  SolvioApprovalsApp:
    build:
      targets:
        SolvioApprovals: all
        SolvioApprovalsAppTests: [test]
        SolvioApprovalsNavigationUITests: [test]
    test:
      targets:
        - SolvioApprovalsAppTests
        - SolvioApprovalsNavigationUITests
