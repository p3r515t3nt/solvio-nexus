# SolvioDesign — reiner Design-Prototyp (Mock-Daten, kein Netz, keine Keychain,
# kein App Attest, keine Face ID). Eigenes Projekt, damit das produktive
# SolvioApprovals.xcodeproj unberuehrt bleibt.
name: SolvioDesign
options:
  bundleIdPrefix: de.solvio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SolvioDesign:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.solvio.design.preview
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SOLVIO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
